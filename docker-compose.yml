services:
  backend:
    build: ./backend
    restart: always
    expose:
      - "80"
    env_file: ./backend/.env

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend/secrets:/usr/local/apache2/conf/secrets:ro
    depends_on:
      - backend
