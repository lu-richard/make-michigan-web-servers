WSGISocketPrefix /usr/local/apache2/logs/wsgi
# One process per vCPU: each process is limited to one core by Python's GIL. Raise processes if the EC2 instance gets more cores.
WSGIDaemonProcess mmra processes=2 threads=15 python-home=/usr python-path=/app
WSGIProcessGroup mmra
WSGIScriptAlias / /app/make_michigan_rest_api/wsgi.py
ServerName localhost

Alias /static/ /app/staticfiles/
<Directory /app/staticfiles>
    Require all granted
</Directory>

<Directory /app/make_michigan_rest_api>
    <Files wsgi.py>
        Require all granted
    </Files>
</Directory>