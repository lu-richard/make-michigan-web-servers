# For debugging, you might want to enable
# LogLevel auth_openidc:debug

OIDCProviderMetadataURL "https://okta.umich.edu/oauth2/default/.well-known/openid-configuration"

# OIDCClientID, OIDCClientSecret and OIDCCryptoPassphrase live here (mounted at runtime, not committed).
Include conf/secrets/oidc_secrets.conf

OIDCProviderTokenEndpointAuth client_secret_post
# VERIFY!!!!!
# Relative, so it resolves to the request's host (http://localhost locally, https://make.engin.umich.edu in prod).
# Each resulting URI must be registered as a sign-in redirect URI on the Okta app.
OIDCRedirectURI "/redirect_uri"
# Caddy terminates TLS and proxies plain http, so build URLs from its forwarded scheme/host (https in prod).
# Only safe because Apache isn't published directly; every request comes through Caddy.
OIDCXForwardedHeaders X-Forwarded-Proto X-Forwarded-Host
OIDCCacheType shm

OIDCSessionCacheFallbackToCookie On
OIDCSessionInactivityTimeout 28800
OIDCSessionType server-cache
OIDCCacheEncrypt On
OIDCStateMaxNumberOfCookies 10 true

# profile adds given_name / middle_name / family_name, used to fill in a new user's profile (see httpd.conf).
OIDCScope "openid email profile"
# REMOTE_USER is the uniqname: the part of the email before @umich.edu.
OIDCRemoteUserClaim email ^(.*)@umich\.edu$
# Expose claims only as env vars; httpd.conf forwards the ones Django needs as explicit headers.
OIDCPassClaimsAs environment

OIDCPreservePost On
OIDCUnAuthAction auth
OIDCUnAutzAction auth
