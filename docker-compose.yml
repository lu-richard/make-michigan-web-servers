services:
  backend:
    build: ./backend
    restart: always
    expose:
      - "80"
    env_file: ./backend/.env

  frontend:
    build: ./frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - backend

  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
