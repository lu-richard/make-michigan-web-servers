ServerRoot "/usr/local/apache2"
Listen 80

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule headers_module modules/mod_headers.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule auth_openidc_module modules/mod_auth_openidc.so

ServerName localhost

Include conf/extra/auth_openidc.conf

<Location />
    AuthType openid-connect
    Require valid-user
</Location>

<Location /logout>
    AuthType None
    Require all granted
</Location>

DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    Options Indexes FollowSymLinks
    AllowOverride None
    FallbackResource /index.html
</Directory>

# Never trust client-supplied identity headers; only set them from the OIDC session.
# Hyphenated names because mod_wsgi drops headers containing underscores (like OIDC_CLAIM_*).
RequestHeader unset X-Remote-User early
RequestHeader unset X-Remote-Given-Name early
RequestHeader unset X-Remote-Middle-Name early
RequestHeader unset X-Remote-Family-Name early
RequestHeader set X-Remote-User expr=%{REMOTE_USER}
RequestHeader set X-Remote-Given-Name expr=%{env:OIDC_CLAIM_given_name}
RequestHeader set X-Remote-Middle-Name expr=%{env:OIDC_CLAIM_middle_name}
RequestHeader set X-Remote-Family-Name expr=%{env:OIDC_CLAIM_family_name}

ProxyPreserveHost On
ProxyPass /api/ http://backend:80/api/
ProxyPassReverse /api/ http://backend:80/api/
